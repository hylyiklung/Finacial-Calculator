<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業資產配置與融資計算器 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #4f46e5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
        
        .asset-tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body class="text-gray-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2">資產配置 & 融資模擬器</h1>
                <p class="text-gray-500">區分現金流貸款與房貸 · 自訂多資產組合 · 真實淨值預測</p>
            </div>
            <div class="flex gap-3">
                <button onclick="saveScenario()" class="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-md transition-all active:scale-95 text-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    儲存方案
                </button>
                <button onclick="resetAll()" class="px-4 py-2 bg-white border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 text-sm">重置</button>
            </div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
            
            <!-- LEFT COLUMN: Inputs -->
            <div class="xl:col-span-4 space-y-6">
                
                <!-- 1. Loans Section -->
                <div class="glass-panel p-6 border-t-4 border-orange-500">
                    <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                        <span class="bg-orange-100 text-orange-600 w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2">1</span>
                        負債管理 (Liabilities)
                    </h2>

                    <!-- Loan Type Tabs -->
                    <div class="flex mb-4 bg-gray-100 p-1 rounded-lg">
                        <button onclick="switchLoanTab('cash')" id="tabCash" class="flex-1 py-1.5 text-sm font-medium rounded-md bg-white shadow text-orange-600 transition">現金貸 (投資用)</button>
                        <button onclick="switchLoanTab('mortgage')" id="tabMortgage" class="flex-1 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700 transition">房貸 (物業)</button>
                    </div>

                    <!-- Add Loan Form -->
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-4">
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <input type="number" id="newLoanAmt" placeholder="金額" class="p-2 text-sm border rounded w-full">
                            <input type="number" id="newLoanRate" placeholder="年利率 %" step="0.1" class="p-2 text-sm border rounded w-full">
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <input type="number" id="newLoanTerm" placeholder="期數(月)" class="p-2 text-sm border rounded w-full">
                            <select id="newLoanType" class="p-2 text-sm border rounded w-full bg-white">
                                <option value="apr">APR 等額本息</option>
                                <option value="flat">月平息 Flat Rate</option>
                            </select>
                        </div>
                        <button onclick="addLoan()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded text-sm font-medium transition">+ 新增此類貸款</button>
                    </div>

                    <!-- Loan Lists -->
                    <div class="space-y-4">
                        <div id="listCashLoans" class="space-y-2 max-h-40 overflow-y-auto custom-scroll">
                            <!-- Cash Loans Injected Here -->
                        </div>
                        <div id="listMortgageLoans" class="space-y-2 max-h-40 overflow-y-auto custom-scroll hidden">
                            <!-- Mortgage Loans Injected Here -->
                        </div>
                    </div>

                    <!-- Loan Summary -->
                    <div class="mt-4 pt-3 border-t border-gray-200 grid grid-cols-2 gap-2 text-xs text-gray-600">
                        <div>總月供: <span id="totalMonthlyPay" class="font-bold text-gray-900">$0</span></div>
                        <div>總利息成本: <span id="totalInterestCost" class="font-bold text-orange-600">$0</span></div>
                    </div>
                </div>

                <!-- 2. Assets & Investments Section -->
                <div class="glass-panel p-6 border-t-4 border-emerald-500">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center">
                            <span class="bg-emerald-100 text-emerald-600 w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2">2</span>
                            資產組合 (Assets)
                        </h2>
                    </div>

                    <!-- Initial Capital -->
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-gray-500 mb-1">初始自有現金 (不含貸款)</label>
                        <input type="number" id="initialCash" value="500000" class="w-full p-2 border rounded bg-white text-sm" oninput="calculate()">
                    </div>

                    <!-- Add Asset Form -->
                    <div class="bg-emerald-50/50 p-4 rounded-lg border border-emerald-100 mb-4">
                        <div class="text-xs font-bold text-emerald-800 mb-2 uppercase tracking-wide">新增投資項目</div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <input type="text" id="newAssetName" placeholder="名稱 (如: 美股ETF)" class="p-2 text-sm border rounded w-full col-span-2">
                            <input type="number" id="newAssetAmt" placeholder="投入金額" class="p-2 text-sm border rounded w-full">
                            <input type="number" id="newAssetAppr" placeholder="年升值率 %" step="0.1" class="p-2 text-sm border rounded w-full">
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <input type="number" id="newAssetYield" placeholder="年股息/租金 %" step="0.1" class="p-2 text-sm border rounded w-full">
                            <select id="newAssetFreq" class="p-2 text-sm border rounded w-full bg-white">
                                <option value="12">月派息/收租</option>
                                <option value="4">季派息</option>
                                <option value="2">半年派息</option>
                                <option value="1">年派息</option>
                            </select>
                        </div>
                        <button onclick="addAsset()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-sm font-medium transition">+ 加入資產組合</button>
                    </div>

                    <!-- Asset List -->
                    <div id="assetList" class="space-y-2 max-h-60 overflow-y-auto custom-scroll">
                        <!-- Assets Injected Here -->
                    </div>

                    <div class="mt-4 pt-3 border-t border-gray-200 flex justify-between text-xs">
                        <span class="text-gray-500">總投入資本</span>
                        <span id="totalInvested" class="font-bold text-emerald-700">$0</span>
                    </div>
                </div>

                <!-- Saved Scenarios -->
                <div class="glass-panel p-4 border-l-4 border-purple-500">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-bold text-gray-700">已儲存方案</h3>
                        <button onclick="clearStorage()" class="text-[10px] text-red-400 hover:text-red-600">清除</button>
                    </div>
                    <div id="savedList" class="max-h-32 overflow-y-auto custom-scroll space-y-1 text-xs"></div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Visualization -->
            <div class="xl:col-span-8 space-y-6">
                
                <!-- KPI Dashboard -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass-panel p-4 border-b-4 border-blue-500">
                        <div class="text-gray-500 text-[10px] uppercase font-bold">最終總資產價值</div>
                        <div id="kpiTotalAsset" class="text-lg md:text-xl font-bold text-gray-800 truncate">--</div>
                    </div>
                    <div class="glass-panel p-4 border-b-4 border-orange-500">
                        <div class="text-gray-500 text-[10px] uppercase font-bold">剩餘未還債務</div>
                        <div id="kpiTotalDebt" class="text-lg md:text-xl font-bold text-orange-600 truncate">--</div>
                    </div>
                    <div class="glass-panel p-4 border-b-4 border-emerald-500">
                        <div class="text-gray-500 text-[10px] uppercase font-bold">真實淨值 (Net Worth)</div>
                        <div id="kpiNetWorth" class="text-lg md:text-xl font-bold text-emerald-600 truncate">--</div>
                    </div>
                    <div class="glass-panel p-4 border-b-4 border-purple-500">
                        <div class="text-gray-500 text-[10px] uppercase font-bold">綜合槓桿 ROE</div>
                        <div id="kpiROE" class="text-lg md:text-xl font-bold text-purple-600 truncate">--</div>
                    </div>
                </div>

                <!-- Main Chart -->
                <div class="glass-panel p-6 h-[450px] relative">
                    <canvas id="mainChart"></canvas>
                </div>

                <!-- Detailed Breakdown Table -->
                <div class="glass-panel overflow-hidden">
                    <div class="px-6 py-3 bg-gray-50 border-b border-gray-200">
                        <h3 class="text-sm font-bold text-gray-700">年度現金流與資產拆解</h3>
                    </div>
                    <div class="overflow-x-auto max-h-80 overflow-y-auto custom-scroll">
                        <table class="min-w-full text-xs md:text-sm text-left">
                            <thead class="bg-gray-100 text-gray-600 sticky top-0 z-10">
                                <tr>
                                    <th class="px-4 py-2">年份</th>
                                    <th class="px-4 py-2">年初淨值</th>
                                    <th class="px-4 py-2">資產增值</th>
                                    <th class="px-4 py-2">被動收入</th>
                                    <th class="px-4 py-2">利息支出</th>
                                    <th class="px-4 py-2">年末淨值</th>
                                </tr>
                            </thead>
                            <tbody id="breakdownTable" class="divide-y divide-gray-100 bg-white"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            cashLoans: [],
            mortgageLoans: [],
            assets: [],
            initialCash: 500000,
            years: 10,
            currentLoanTab: 'cash'
        };

        let chartInstance = null;
        const STORAGE_KEY = 'proAssetCalc_v2';

        // --- Initialization ---
        window.onload = () => {
            loadFromStorage();
            renderAll();
            calculate();
        };

        function renderAll() {
            renderLoanList('cash');
            renderLoanList('mortgage');
            renderAssetList();
            renderSavedList();
            document.getElementById('initialCash').value = state.initialCash;
        }

        // --- Loan Logic ---

        function switchLoanTab(tab) {
            state.currentLoanTab = tab;
            document.getElementById('tabCash').className = tab === 'cash' 
                ? "flex-1 py-1.5 text-sm font-medium rounded-md bg-white shadow text-orange-600 transition" 
                : "flex-1 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700 transition";
            document.getElementById('tabMortgage').className = tab === 'mortgage' 
                ? "flex-1 py-1.5 text-sm font-medium rounded-md bg-white shadow text-orange-600 transition" 
                : "flex-1 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700 transition";
            
            document.getElementById('listCashLoans').classList.toggle('hidden', tab !== 'cash');
            document.getElementById('listMortgageLoans').classList.toggle('hidden', tab !== 'mortgage');
        }

        function addLoan() {
            const amt = parseFloat(document.getElementById('newLoanAmt').value) || 0;
            const rate = parseFloat(document.getElementById('newLoanRate').value) || 0;
            const term = parseInt(document.getElementById('newLoanTerm').value) || 0;
            const type = document.getElementById('newLoanType').value;

            if (amt <= 0 || term <= 0) {
                Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: '請輸入有效金額及期數', showConfirmButton: false, timer: 2000 });
                return;
            }

            const loan = { id: Date.now(), amount: amt, rate, term, type };
            
            if (state.currentLoanTab === 'cash') {
                state.cashLoans.push(loan);
            } else {
                state.mortgageLoans.push(loan);
            }

            // Clear inputs
            document.getElementById('newLoanAmt').value = '';
            document.getElementById('newLoanRate').value = '';
            document.getElementById('newLoanTerm').value = '';

            renderLoanList(state.currentLoanTab);
            calculate();
        }

        function removeLoan(id, category) {
            if (category === 'cash') state.cashLoans = state.cashLoans.filter(l => l.id !== id);
            else state.mortgageLoans = state.mortgageLoans.filter(l => l.id !== id);
            
            renderLoanList(category);
            calculate();
        }

        function renderLoanList(category) {
            const container = document.getElementById(category === 'cash' ? 'listCashLoans' : 'listMortgageLoans');
            const list = category === 'cash' ? state.cashLoans : state.mortgageLoans;
            
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 text-xs py-4 italic">暫無${category === 'cash' ? '現金貸' : '房貸'}紀錄</div>`;
                return;
            }

            list.forEach(l => {
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded border border-gray-200 shadow-sm flex justify-between items-center group";
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-sm">${formatMoney(l.amount)}</div>
                        <div class="text-[10px] text-gray-500">${l.rate}% · ${l.term}個月 · ${l.type.toUpperCase()}</div>
                    </div>
                    <button onclick="removeLoan(${l.id}, '${category}')" class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">&times;</button>
                `;
                container.appendChild(div);
            });
        }

        // --- Asset Logic ---

        function addAsset() {
            const name = document.getElementById('newAssetName').value.trim() || "未命名資產";
            const amt = parseFloat(document.getElementById('newAssetAmt').value) || 0;
            const appr = parseFloat(document.getElementById('newAssetAppr').value) || 0;
            const yld = parseFloat(document.getElementById('newAssetYield').value) || 0;
            const freq = parseInt(document.getElementById('newAssetFreq').value) || 12;

            if (amt <= 0) {
                Swal.fire({ toast: true, position: 'top-end', icon: 'warning', title: '投入金額需大於0', showConfirmButton: false, timer: 2000 });
                return;
            }

            state.assets.push({
                id: Date.now(), name, amount: amt, appreciation: appr, yieldRate: yld, freq
            });

            // Reset inputs
            document.getElementById('newAssetName').value = '';
            document.getElementById('newAssetAmt').value = '';
            document.getElementById('newAssetAppr').value = '';
            document.getElementById('newAssetYield').value = '';

            renderAssetList();
            calculate();
        }

        function removeAsset(id) {
            state.assets = state.assets.filter(a => a.id !== id);
            renderAssetList();
            calculate();
        }

        function renderAssetList() {
            const container = document.getElementById('assetList');
            container.innerHTML = '';
            
            if (state.assets.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 text-xs py-4 italic">尚未添加任何投資項目</div>`;
                document.getElementById('totalInvested').innerText = "$0";
                return;
            }

            let total = 0;
            state.assets.forEach(a => {
                total += a.amount;
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded border border-emerald-100 shadow-sm flex justify-between items-start group";
                div.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-gray-800 text-sm">${a.name}</span>
                            <span class="asset-tag bg-emerald-100 text-emerald-700">升值 ${a.appreciation}%</span>
                            <span class="asset-tag bg-blue-100 text-blue-700">息率 ${a.yieldRate}%</span>
                        </div>
                        <div class="text-xs text-gray-500">本金: ${formatMoney(a.amount)} · ${a.freq}次/年派息</div>
                    </div>
                    <button onclick="removeAsset(${a.id})" class="text-gray-300 hover:text-red-500 ml-2">&times;</button>
                `;
                container.appendChild(div);
            });
            document.getElementById('totalInvested').innerText = formatMoney(total);
        }

        // --- Core Calculation Engine ---

        function calculate() {
            state.initialCash = parseFloat(document.getElementById('initialCash').value) || 0;
            const allLoans = [...state.cashLoans, ...state.mortgageLoans];
            
            // 1. Calculate Loan Schedules (Monthly)
            // We need max months to determine simulation length
            const maxLoanMonths = allLoans.reduce((max, l) => Math.max(max, l.term), 0);
            const simMonths = Math.max(maxLoanMonths, state.years * 12); // Simulate at least 'years' or until debt free

            // Prepare monthly trackers
            let monthlyDebtService = new Array(simMonths).fill(0); // Principal + Interest
            let monthlyInterestOnly = new Array(simMonths).fill(0);
            let remainingDebtBalance = new Array(simMonths).fill(0);

            // Initialize debt balance
            let currentTotalDebt = allLoans.reduce((sum, l) => sum + l.amount, 0);
            
            // Process each loan
            allLoans.forEach(loan => {
                const schedule = generateAmortization(loan);
                let bal = loan.amount;
                for(let m=0; m<simMonths; m++) {
                    if (m < loan.term) {
                        monthlyDebtService[m] += schedule[m].total;
                        monthlyInterestOnly[m] += schedule[m].interest;
                        bal -= schedule[m].principal;
                    }
                    // Note: This simple aggregation assumes we track total debt correctly
                    // For precise remaining balance array, we'd sum individual balances
                }
            });

            // Recalculate precise remaining debt balance array
            let tempBal = currentTotalDebt;
            for(let m=0; m<simMonths; m++) {
                const principalPaid = monthlyDebtService[m] - monthlyInterestOnly[m];
                tempBal -= principalPaid;
                remainingDebtBalance[m] = Math.max(0, tempBal);
            }

            // 2. Simulate Asset Growth & Income (Monthly)
            let assetValues = state.assets.map(a => ({ ...a, currentValue: a.amount }));
            let totalAssetValueArr = new Array(simMonths).fill(0);
            let totalIncomeArr = new Array(simMonths).fill(0);
            let totalAppreciationArr = new Array(simMonths).fill(0);

            // Initial Total Assets = Own Cash + Loan Cash (Assuming all loans are drawn down at T=0 and invested)
            // Note: In this model, we assume user invests the borrowed money immediately into the defined assets
            // If Own Cash + Loans > Sum of Assets defined, the remainder sits as cash (0% return for simplicity or could add cash asset)
            
            // For simplicity in this UI: We track the SPECIFIC assets added. 
            // The "Net Worth" = (Sum of Specific Assets + Remaining Own Cash) - Debt
            // But usually users want to see "If I borrow X and put into Y".
            // Let's assume: Total Investable Capital = Initial Cash + Total Loans
            // And user allocates them into the Asset List.
            
            // To be safe, we just simulate the ASSETS LIST provided.
            // Net Worth = (Initial Cash + Total Loans - Total Debt Paid So Far) ?? No.
            // Net Worth = (Current Value of All Assets) - (Remaining Debt)
            // Wait, where did the money come from? 
            // Equity = Assets - Liabilities.
            // If I have 500k cash, borrow 500k, buy 1M house. Asset=1M, Debt=500k, Equity=500k.
            // So we just simulate the growth of the ASSET LIST.
            
            // Check if Total Assets defined matches Capital Available? 
            // We will just simulate what is in the list. User responsibility to match funding.

            for(let m=0; m<simMonths; m++) {
                let monthAssetVal = 0;
                let monthIncome = 0;
                let monthAppr = 0;

                assetValues.forEach(asset => {
                    // Appreciation (Compounded monthly)
                    const monthlyApprRate = Math.pow(1 + asset.appreciation/100, 1/12) - 1;
                    const valIncrease = asset.currentValue * monthlyApprRate;
                    asset.currentValue += valIncrease;
                    monthAppr += valIncrease;

                    // Income (Based on frequency)
                    // Simple approach: Annual Yield / 12, paid if month % (12/freq) == 0
                    // Or smoother: Just divide annual yield by 12 for chart smoothness
                    // Let's do smooth for chart, accurate for table
                    const monthlyYield = asset.currentValue * (asset.yieldRate / 100) / 12;
                    monthIncome += monthlyYield;

                    monthAssetVal += asset.currentValue;
                });

                totalAssetValueArr[m] = monthAssetVal;
                totalIncomeArr[m] = monthIncome;
                totalAppreciationArr[m] = monthAppr;
            }

            // 3. Aggregate Yearly Data for Chart & Table
            const labels = ["現在"];
            const dataNetWorth = [state.initialCash + allLoans.reduce((s,l)=>s+l.amount,0) - currentTotalDebt]; // Initial NW = Own Cash (assuming assets listed = own cash + loans)
            // Actually, simpler: Initial NW = Own Cash. (Loans cancel out with invested assets initially)
            // But if user didn't allocate all funds to assets, it's tricky.
            // Let's assume: Initial NW = Own Cash.
            const initialNW = state.initialCash; 
            
            const chartNetWorth = [initialNW];
            const chartAssets = [state.assets.reduce((s,a)=>s+a.amount, 0)]; // Initial asset value
            const chartDebt = [currentTotalDebt];

            const tableData = [];
            let cumIncome = 0;
            let cumInterest = 0;
            let cumAppr = 0;
            let prevNW = initialNW;

            // Adjust initial asset value to match reality if needed, but let's trust user input
            // If User has 500k cash, borrows 500k, but only adds 800k assets -> 200k cash unaccounted.
            // We will add a virtual "Cash Balance" asset implicitly? 
            // For now, strictly follow: NW = Defined Assets - Defined Debts.
            // Correction: NW should include the uninvested cash too.
            // Uninvested Cash = (OwnCash + Loans) - Sum(Assets)
            const totalCapital = state.initialCash + currentTotalDebt;
            const definedAssetBase = state.assets.reduce((s,a)=>s+a.amount, 0);
            let idleCash = totalCapital - definedAssetBase; 

            for(let y=1; y<=state.years; y++) {
                const endMonthIdx = y * 12 - 1;
                if (endMonthIdx >= simMonths) break;

                // Sum up monthly flows for this year
                let yrIncome = 0, yrInterest = 0, yrAppr = 0;
                for(let m=(y-1)*12; m<y*12; m++) {
                    yrIncome += totalIncomeArr[m];
                    yrInterest += monthlyInterestOnly[m];
                    yrAppr += totalAppreciationArr[m];
                }

                // Idle cash grows at 0% (or could add savings rate later)
                // Reinvest income? Assume income is withdrawn or reinvested at same rate?
                // For simplicity: Income adds to NW, Interest subtracts from NW.
                // Asset Value already includes appreciation.
                
                const currentAssetVal = totalAssetValueArr[endMonthIdx] + idleCash; // Idle cash stays flat
                const currentDebtVal = remainingDebtBalance[endMonthIdx];
                const currentNW = currentAssetVal - currentDebtVal;

                labels.push(`第 ${y} 年`);
                chartNetWorth.push(currentNW);
                chartAssets.push(currentAssetVal);
                chartDebt.push(currentDebtVal);

                tableData.push({
                    year: y,
                    startNW: prevNW,
                    appreciation: yrAppr,
                    income: yrIncome,
                    interest: yrInterest,
                    endNW: currentNW
                });

                prevNW = currentNW;
                cumIncome += yrIncome;
                cumInterest += yrInterest;
            }

            // Update KPIs
            const finalNW = chartNetWorth[chartNetWorth.length-1];
            const roe = initialNW > 0 ? ((finalNW - initialNW) / initialNW * 100).toFixed(1) : "0.0";
            
            document.getElementById('kpiTotalAsset').innerText = formatMoney(chartAssets[chartAssets.length-1]);
            document.getElementById('kpiTotalDebt').innerText = formatMoney(chartDebt[chartDebt.length-1]);
            document.getElementById('kpiNetWorth').innerText = formatMoney(finalNW);
            document.getElementById('kpiROE').innerText = roe + "%";

            // Loan Summary
            const totalMonthly = monthlyDebtService.length > 0 ? monthlyDebtService[0] : 0; // First month payment
            const totalInt = monthlyInterestOnly.reduce((a,b)=>a+b, 0);
            document.getElementById('totalMonthlyPay').innerText = formatMoney(totalMonthly);
            document.getElementById('totalInterestCost').innerText = formatMoney(totalInt);

            renderChart(labels, chartAssets, chartNetWorth, chartDebt);
            renderTable(tableData);
        }

        function generateAmortization(loan) {
            const schedule = [];
            const r = loan.rate / 100 / 12;
            let balance = loan.amount;
            
            if (loan.type === 'flat') {
                const monthlyPrincipal = loan.amount / loan.term;
                const monthlyInterest = loan.amount * (loan.rate / 100) / 12;
                for(let i=0; i<loan.term; i++) {
                    schedule.push({ principal: monthlyPrincipal, interest: monthlyInterest, total: monthlyPrincipal + monthlyInterest });
                }
            } else {
                const pmt = r === 0 ? loan.amount/loan.term : loan.amount * (r * Math.pow(1+r, loan.term)) / (Math.pow(1+r, loan.term) - 1);
                for(let i=0; i<loan.term; i++) {
                    const interest = balance * r;
                    const principal = pmt - interest;
                    balance -= principal;
                    schedule.push({ principal, interest, total: pmt });
                }
            }
            return schedule;
        }

        // --- Visualization ---

        function renderChart(labels, assets, nw, debt) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: '總資產價值', data: assets, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', borderWidth: 2, fill: true, tension: 0.3 },
                        { label: '真實淨值', data: nw, borderColor: '#4f46e5', borderWidth: 3, fill: false, tension: 0.3 },
                        { label: '未償還債務', data: debt, borderColor: '#f97316', borderDash: [5,5], borderWidth: 2, fill: false, tension: 0.1 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}: ${formatMoney(c.parsed.y)}` } } },
                    scales: { y: { ticks: { callback: v => '$'+(v/1000).toFixed(0)+'k' } } }
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('breakdownTable');
            tbody.innerHTML = '';
            data.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 border-b border-gray-100";
                tr.innerHTML = `
                    <td class="px-4 py-2 font-medium">第 ${r.year} 年</td>
                    <td class="px-4 py-2 text-gray-600">${formatMoney(r.startNW)}</td>
                    <td class="px-4 py-2 text-emerald-600">+${formatMoney(r.appreciation)}</td>
                    <td class="px-4 py-2 text-blue-600">+${formatMoney(r.income)}</td>
                    <td class="px-4 py-2 text-orange-600">-${formatMoney(r.interest)}</td>
                    <td class="px-4 py-2 font-bold text-gray-800">${formatMoney(r.endNW)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- Utilities ---

        function formatMoney(n) {
            return new Intl.NumberFormat('zh-HK', { style: 'currency', currency: 'HKD', maximumFractionDigits: 0 }).format(n);
        }

        async function saveScenario() {
            const scenarios = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if(scenarios.length >= 5) { Swal.fire('儲存已滿', '請刪除舊方案', 'warning'); return; }
            
            const { value: name } = await Swal.fire({ title: '儲存方案', input: 'text', inputPlaceholder: '例如: 2024 倫敦買樓計劃', confirmButtonColor: '#4f46e5' });
            if(name) {
                scenarios.push({ name, date: new Date().toLocaleDateString(), state: JSON.parse(JSON.stringify(state)) });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(scenarios));
                renderSavedList();
                Swal.fire({toast:true, position:'top-end', icon:'success', title:'已儲存', showConfirmButton:false, timer:1500});
            }
        }

        function loadScenario(idx) {
            const scenarios = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if(scenarios[idx]) {
                Object.assign(state, scenarios[idx].state);
                renderAll();
                calculate();
            }
        }

        function deleteScenario(e, idx) {
            e.stopPropagation();
            const scenarios = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            scenarios.splice(idx, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(scenarios));
            renderSavedList();
        }

        function clearStorage() {
            if(confirm("確定清除所有儲存?")) { localStorage.removeItem(STORAGE_KEY); renderSavedList(); }
        }

        function resetAll() {
            if(confirm("重置所有輸入?")) {
                state.cashLoans = []; state.mortgageLoans = []; state.assets = []; state.initialCash = 500000;
                renderAll(); calculate();
            }
        }

        function renderSavedList() {
            const c = document.getElementById('savedList');
            const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            c.innerHTML = list.length ? '' : '<div class="text-gray-400 italic text-center py-2">無紀錄</div>';
            list.forEach((item, i) => {
                const d = document.createElement('div');
                d.className = "flex justify-between items-center p-2 bg-gray-50 hover:bg-indigo-50 rounded cursor-pointer border border-transparent hover:border-indigo-200";
                d.onclick = () => loadScenario(i);
                d.innerHTML = `<div><div class="font-bold text-gray-700">${item.name}</div><div class="text-[10px] text-gray-400">${item.date}</div></div><button onclick="deleteScenario(event, ${i})" class="text-gray-400 hover:text-red-500">&times;</button>`;
                c.appendChild(d);
            });
        }
    </script>
</body>
